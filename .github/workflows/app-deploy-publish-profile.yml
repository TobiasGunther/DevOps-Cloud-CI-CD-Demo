# ---------------------------------------------------------------------------
# Demo 2, the insecure half: "nøkkelen under matta".
#
# Deploys with a PUBLISH PROFILE - an XML blob containing a username and a password
# in clear text, pasted into GitHub as a repository secret.
#
# It works. That is the uncomfortable part. What it costs you:
#   - the credential left Azure and now lives at a second vendor
#   - it grants everything on this app, with no way to narrow it
#   - the Azure activity log shows "the app was updated", not who updated it
#   - rotating it means changing it by hand everywhere, so nobody ever does
#
# Azure now disables SCM basic authentication on new apps by default. This demo
# only works because infra/modules/webapp.bicep deliberately switches it back on.
#
# Compare with app-deploy-oidc.yml. The build job is identical; only the deploy
# job differs. That diff is the whole lesson.
# ---------------------------------------------------------------------------
name: App - deploy with publish profile (insecure)

on:
  workflow_dispatch:

concurrency:
  group: app-deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Note what is NOT here: no id-token. This workflow does not prove who it is,
  # it just presents a password.

jobs:
  build:
    name: Build once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # SourceRevisionId is what the SDK appends to InformationalVersion as "+<sha>".
      # Setting InformationalVersion to "1.0.N+<sha>" by hand instead gets the revision
      # appended a second time, and /api/info then reports the commit twice.
      - name: Publish
        run: |
          dotnet publish app/src/DemoApi/DemoApi.csproj \
            --configuration Release \
            --output ./publish \
            -p:Version=1.0.${{ github.run_number }} \
            -p:SourceRevisionId=${{ github.sha }}

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-publish-profile-${{ github.run_number }}
          path: ./publish
          retention-days: 7

  deploy:
    name: Deploy with a stored secret
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download the artifact built above
        uses: actions/download-artifact@v8
        with:
          name: app-publish-profile-${{ github.run_number }}
          path: ./publish

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
          # The entire credential, handed to a third party.
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Smoke test the deployed app
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}"
          echo "Waiting for $url to serve the new build..."
          for attempt in $(seq 1 20); do
            if body=$(curl -fsS --max-time 20 "$url/api/info"); then
              echo "$body" | jq .
              deployed=$(echo "$body" | jq -r .commit)
              if [ "$deployed" = "${{ github.sha }}" ]; then
                echo "Live commit matches this run."
                echo "### Deployed via publish profile: [$url]($url)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Attempt $attempt: live commit is $deployed, waiting..."
            else
              echo "Attempt $attempt: app not answering yet."
            fi
            sleep 10
          done
          echo "::error::The app never reported the expected commit."
          exit 1
