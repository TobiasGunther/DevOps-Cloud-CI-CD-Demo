# ---------------------------------------------------------------------------
# Infrastructure as code -> Azure.
#
# The privileged pipeline - but only within one resource group. Its identity holds
# Contributor AND Role Based Access Control Administrator there, because it creates
# resources and the role assignment for the app-deploy identity.
#
# Contrast it with app-deploy-oidc.yml, whose identity holds a single narrow role on
# that same resource group. Two pipelines, two identities, very different power,
# and nothing subscription-wide anywhere.
#
# Only main can reach Azure. The identity trusts exactly one subject,
# ref:refs/heads/main, so a run from any other branch - or from a pull request - is
# refused a token. Pull requests still get a compile check of the Bicep, which needs
# no Azure access at all.
# Setup: docs/00-azure-setup.md
# ---------------------------------------------------------------------------
name: Infra - deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch:

concurrency:
  group: infra-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The resource group is a prerequisite created once by hand, not by this pipeline:
  # see docs/00-azure-setup.md. Deploying into it needs no subscription-level rights.
  RESOURCE_GROUP: rg-devops-demo-dev
  PARAM_FILE: infra/main.dev.bicepparam

jobs:
  validate:
    name: Compile the Bicep
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Deliberately no Azure sign-in. A pull request runs the workflow file from its own
    # branch, so anything it can authenticate as, a branch can misuse. Compiling the
    # templates catches the common mistakes and needs no access at all.
    steps:
      - uses: actions/checkout@v7

      - name: Compile the templates and parameters
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file "$PARAM_FILE" --stdout > /dev/null
          echo "Bicep compiles. Changes are applied only after merge, from main." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy infrastructure
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Only this job may request an OIDC token, and Azure accepts it only from main.
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure with a short-lived token
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_IAC_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --parameters "$PARAM_FILE" \
            --name "infra-${{ github.run_id }}" \
            --query properties.outputs -o json)

          echo "$outputs" | jq -r 'to_entries[] | "\(.key)=\(.value.value)"' >> "$GITHUB_OUTPUT"
          echo "$outputs" | jq -r 'to_entries[] | "\(.key)=\(.value.value)"'

      - name: Report
        run: |
          {
            echo '## Infrastructure deployed'
            echo ''
            echo "| | |"
            echo "| --- | --- |"
            echo "| Resource group | \`${{ steps.deploy.outputs.resourceGroupName }}\` |"
            echo "| Web app | \`${{ steps.deploy.outputs.webAppName }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.webAppUrl }} |"
            echo "| SCM basic auth (the insecure path) | \`${{ steps.deploy.outputs.scmBasicAuthEnabled }}\` |"
            echo "| App-deploy identity client ID | \`${{ steps.deploy.outputs.deployIdentityClientId }}\` |"
            echo ''
            echo 'Copy the web app name into the repository variable `AZURE_WEBAPP_NAME`,'
            echo 'and the client ID into `AZURE_DEPLOY_CLIENT_ID`. Neither is a secret.'
          } >> "$GITHUB_STEP_SUMMARY"
